<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etiqueta de Cliente</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
  /* Etiqueta de 3.5" x 1.1" (rollo tipo Dymo 30252 / Brother 1-1/8" x 3-1/2").
     Con ?rot=1 la hoja se manda vertical (1.1" x 3.5") y el contenido girado,
     para impresoras que alimentan la etiqueta de lado. */
  @page { size: 3.5in 1.1in; margin: 0; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #e9e9e9;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .label {
    width: 3.5in; height: 1.1in;
    padding: 0.14in 0.18in 0.08in;      /* margen seguro: la orilla no se imprime y las esquinas son redondeadas */
    background: #fff;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow: hidden;
    margin: 24px auto 12px;
    outline: 1px dashed #999;            /* solo en pantalla, como guía del borde */
  }
  .nombre {
    width: 100%;
    font-weight: bold; text-align: center; line-height: 1.1;
    white-space: nowrap; overflow: hidden;
    font-size: 11pt;                     /* se reduce solo si el nombre no cabe */
    padding-top: 1px;
  }
  .barcode { width: 100%; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin-top: 0.03in; }
  .barcode svg { display: block; max-width: 100%; max-height: 100%; }
  .aviso { font-size: 9pt; color: #900; }

  .toolbar { text-align: center; font: 13px Arial, sans-serif; color: #444; }
  .toolbar button { font: 600 14px Arial, sans-serif; padding: 8px 18px; border-radius: 5px; border: 1px solid #333; background: #333; color: #fff; cursor: pointer; }

  /* modo girado (?rot=1) */
  body.rot .label { transform: rotate(90deg); transform-origin: center; margin: 1.4in auto; }

  @media print {
    body { background: #fff; }
    .toolbar { display: none !important; }
    .label { margin: 0; outline: none; page-break-after: avoid; break-after: avoid; }
    body.rot .label {
      position: absolute; top: 0; left: 0;
      transform: translateX(1.1in) rotate(90deg); transform-origin: top left; margin: 0;
    }
  }
</style>
</head>
<body>
  <div class="label" id="label">
    <div class="nombre" id="NombreCompleto"></div>
    <div class="barcode"><svg id="CodigoBarra"></svg></div>
  </div>

  <div class="toolbar">
    <button onclick="window.print()">Imprimir</button>
    <p>Papel: 3.5" x 1.1" · Márgenes: Ninguno · Escala: 100%</p>
  </div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const q = new URLSearchParams(window.location.search);
  const nombre   = (q.get("Completo") || "").trim();
  const telefono = (q.get("Telefono") || "").trim();

  // modo girado para impresoras que alimentan la etiqueta de lado
  if (q.get("rot") === "1") {
    document.body.classList.add("rot");
    const st = document.createElement("style");
    st.textContent = "@page { size: 1.1in 3.5in; margin: 0; }";
    document.head.appendChild(st);
  }

  // Ajuste fino si la impresora corta arriba o abajo: ?bajar=0.05 (pulgadas; negativo para subir)
  const bajar = parseFloat(q.get("bajar"));
  if (isFinite(bajar) && bajar !== 0) {
    const lab = document.getElementById("label");
    const top = Math.max(0, 0.14 + bajar), bottom = Math.max(0, 0.08 - bajar);
    lab.style.paddingTop = top + "in"; lab.style.paddingBottom = bottom + "in";
  }

  // Nombre: se achica hasta que quepa en una línea (mínimo 7pt)
  const elNombre = document.getElementById("NombreCompleto");
  elNombre.textContent = nombre || "Dato no disponible";
  let pt = 11;
  while (elNombre.scrollWidth > elNombre.clientWidth && pt > 7) {
    pt -= 0.5;
    elNombre.style.fontSize = pt + "pt";
  }

  // Código de barras: solo los dígitos del teléfono, para que siempre se lea igual
  const digitos = telefono.replace(/\D/g, "");
  const svg = document.getElementById("CodigoBarra");
  if (digitos) {
    JsBarcode(svg, digitos, {
      format: "CODE128",
      lineColor: "#000",
      width: 2,
      height: 60,
      margin: 0,
      displayValue: true,
      fontSize: 15,
      textMargin: 1,
      text: digitos.length === 10
        ? "(" + digitos.slice(0, 3) + ") " + digitos.slice(3, 6) + "-" + digitos.slice(6)
        : digitos
    });
    // que el código se ajuste al espacio de la etiqueta sin deformarse
    const w = svg.getAttribute("width"), h = svg.getAttribute("height");
    svg.setAttribute("viewBox", "0 0 " + parseFloat(w) + " " + parseFloat(h));
    svg.removeAttribute("width"); svg.removeAttribute("height");
    svg.style.width = "100%"; svg.style.height = "100%";
  } else {
    svg.outerHTML = '<span class="aviso">Teléfono no disponible</span>';
  }

  // ?p=1 imprime en cuanto carga
  if (q.get("p") === "1") setTimeout(function () { window.print(); }, 300);
});
</script>
</body>
</html>
