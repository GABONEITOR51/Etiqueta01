<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        /* Tamaño real de la etiqueta 1.1" x 3.5" */
        @page { 
            size: 89mm 28mm; /* 3.5" x 1.1" */
            margin: 0;
        }

        body { 
            width: 89mm;
            height: 28mm;
            margin: 0;
            padding: 0;
        }

        .label {
            width: 100%;
            height: 100%;
            padding: 2mm;
            box-sizing: border-box;
            text-align: center; /* CENTRA TODO */
            overflow: hidden;
        }

        #NombreCompleto {
            font-size: 14px;
            font-weight: bold;
            display: block;
        }

        .barcode {
            margin-top: 2mm;
        }
    </style>
</head>

<body>
    <div class="label">
        <span id="NombreCompleto"></span>

        <div class="barcode">
            <svg id="CodigoBarra"></svg>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);

            const NombreCompleto = urlParams.get('Completo');
            const Telefono = urlParams.get('Telefono');

            document.getElementById("NombreCompleto").textContent =
                NombreCompleto || "Dato no disponible";

            if (Telefono) {
                JsBarcode("#CodigoBarra", Telefono, {
                    format: "CODE128",
                    lineColor: "#000",
                    width: 1,      // MÁS DELGADO
                    height: 40,
                    displayValue: true
                });
            } else {
                document.getElementById("CodigoBarra").textContent =
                    "Teléfono no disponible";
            }
        });
    </script>
</body>
</html>
